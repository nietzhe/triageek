[project]
name = "triageek"
version = "0.1.0"
description = "Mini SOC Lab: a Django case-management app for Wazuh alerts"
readme = "README.md"
authors = [
    { name = "nietzhe", email = "ficoyayanpurwadi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
]

[project.scripts]
triageek = "triageek:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
